name: diamol-ch16-package-release

on:
  push:
    paths:
      - ".github/workflows/diamol-ch16-package-release.yaml"
      - "labs/00-docker/diamol/ch16/cicd/tag-push.ps1"
      - "labs/00-docker/diamol/ch16/cicd/set-vars.ps1"
      - "labs/00-docker/diamol/ch16/src/docker-compose*.yml"
  workflow_run:
    workflows: [diamol-ch16-smoke-test]
    types: [completed]
    branches:
      - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository_owner }}

jobs:
  package:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push-release
        working-directory: labs/00-docker/diamol/ch16/cicd
        run: ./tag-push.ps1 -From staging -To release
        shell: pwsh
    permissions:
      contents: read
      packages: write
