name: diamol-ch16-smoke-test-windows

on:
  # push:
  #   paths:
  #     - ".github/workflows/diamol-ch16-smoke-test-windows.yaml"
  # workflow_run:
  #   workflows: [diamol-ch16-package-staging-windows]
  #   types: [completed]
  #   branches:
  #     - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository_owner }}

jobs:
  smoke-test-windows:
    runs-on: windows-2022
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@master
      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke-test-windows
        working-directory: labs/00-docker/diamol/ch16/cicd
        run: ./smoke-test.ps1
        shell: pwsh
