name: bmwdk

on:
  push:
    # branches:
    #   - main
    paths:
      - ".github/workflows/bmwdk.yaml"
      - "labs/40-microservices/video-streaming/**"
      - "labs/40-microservices/infra/k8s/**"
      - "labs/40-microservices/infra/scripts/**"
  workflow_dispatch:

env:
  IMAGE_NAME: video-streaming
  VERSION: ${{ github.sha }}
  CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_UN }}
          password: ${{ secrets.REGISTRY_PW }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: labs/40-microservices/video-streaming
          file: labs/40-microservices/video-streaming/Dockerfile-prod
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Kustomize
        working-directory: labs/40-microservices
        run: ./infra/scripts/deploy.sh
