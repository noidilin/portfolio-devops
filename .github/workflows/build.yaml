name: build

on:
  push:
    paths:
      - ".github/workflows/build.yaml"
      - "labs/00-basic-docker-in-a-month-of-lunches/ch16/cicd/build.ps1"
      - "labs/00-basic-docker-in-a-month-of-lunches/ch16/src/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: build
        working-directory: labs/00-basic-docker-in-a-month-of-lunches/ch16/cicd
        run: ./build.ps1
        shell: pwsh
