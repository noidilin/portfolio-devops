name: diamol-ch16-package-release-windows

on:
  # push:
  #   paths:
  #     - ".github/workflows/diamol-ch16-package-release-windows.yaml"
  # workflow_run:
  #   workflows: [diamol-ch16-smoke-test-windows]
  #   types: [completed]
  #   branches:
  #     - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository_owner }}

jobs:
  package:
    runs-on: windows-2022
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push-release
        working-directory: labs/00-docker/diamol/ch16/cicd
        run: ./tag-push.ps1 -From staging -To release
        shell: pwsh
    permissions:
      contents: read
      packages: write
