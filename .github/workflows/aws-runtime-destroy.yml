name: aws-runtime-destroy

on:
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab runtime to destroy"
        required: true
        type: choice
        options:
          - "05-static-site-ec2"
          - "06-static-site-ecs"

permissions:
  contents: read

concurrency:
  group: aws-runtime-destroy-${{ inputs.lab }}
  cancel-in-progress: false

jobs:
  select-lab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      apply_role_arn: ${{ steps.select.outputs.apply_role_arn }}
      ecr_repository_name: ${{ steps.select.outputs.ecr_repository_name }}
      environment: ${{ steps.select.outputs.environment }}
      path: ${{ steps.select.outputs.path }}
      runtime_kind: ${{ steps.select.outputs.runtime_kind }}
      state_bucket: ${{ steps.select.outputs.state_bucket }}
      state_key: ${{ steps.select.outputs.state_key }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.lab }}" in
            05-static-site-ec2)
              echo "apply_role_arn=arn:aws:iam::549475122024:role/devops-static-site-ec2-stage-github-apply" >> "$GITHUB_OUTPUT"
              echo "ecr_repository_name=devops-static-site-ec2-stage-cidr-calculator" >> "$GITHUB_OUTPUT"
              echo "environment=lab-05-stage" >> "$GITHUB_OUTPUT"
              echo "path=labs/05-static-site-ec2" >> "$GITHUB_OUTPUT"
              echo "runtime_kind=ec2" >> "$GITHUB_OUTPUT"
              echo "state_bucket=noidilin-tf-state" >> "$GITHUB_OUTPUT"
              echo "state_key=labs/05-static-site-ec2/infra/stage/terraform.tfstate" >> "$GITHUB_OUTPUT"
              ;;
            06-static-site-ecs)
              echo "apply_role_arn=arn:aws:iam::549475122024:role/devops-static-site-ecs-stage-github-apply" >> "$GITHUB_OUTPUT"
              echo "ecr_repository_name=devops-static-site-ecs-stage-cidr-calculator" >> "$GITHUB_OUTPUT"
              echo "environment=lab-06-stage" >> "$GITHUB_OUTPUT"
              echo "path=labs/06-static-site-ecs" >> "$GITHUB_OUTPUT"
              echo "runtime_kind=ecs-express" >> "$GITHUB_OUTPUT"
              echo "state_bucket=noidilin-tf-state" >> "$GITHUB_OUTPUT"
              echo "state_key=labs/06-static-site-ecs/infra/stage/terraform.tfstate" >> "$GITHUB_OUTPUT"
              ;;
          esac

  approved-destroy:
    name: Approved destroy for ${{ inputs.lab }}
    needs: select-lab
    runs-on: ubuntu-latest
    environment: ${{ needs.select-lab.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY_NAME: ${{ needs.select-lab.outputs.ecr_repository_name }}
      LAB_PATH: ${{ needs.select-lab.outputs.path }}
      RUNTIME_KIND: ${{ needs.select-lab.outputs.runtime_kind }}
      STATE_BUCKET: ${{ needs.select-lab.outputs.state_bucket }}
      STATE_KEY: ${{ needs.select-lab.outputs.state_key }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          working_directory: ${{ env.LAB_PATH }}

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ needs.select-lab.outputs.apply_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write Terraform backend config
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF_BACKEND
          bucket       = "${STATE_BUCKET}"
          key          = "${STATE_KEY}"
          region       = "${AWS_REGION}"
          use_lockfile = true
          encrypt      = true
          EOF_BACKEND

      - name: Capture runtime outputs before destroy
        id: before
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl

          capture_output() {
            local name="$1"
            local value
            value=$(terraform output -raw "$name" 2>/dev/null || true)
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          }

          # Common Bootstrap/Runtime boundary outputs.
          capture_output ecr_repository_name
          capture_output ecr_repository_url
          capture_output service_url

          # Lab-specific runtime identifiers used for post-destroy absence checks.
          capture_output instance_id
          capture_output security_group_id
          capture_output ecs_cluster_name
          capture_output express_service_arn
          capture_output express_service_name
          capture_output cloudwatch_log_group_name

      - name: Terraform destroy selected runtime only
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="sha-${GITHUB_SHA}"
          terraform destroy -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Confirm runtime gone and AWS bootstrap remains
        shell: bash
        env:
          CAPTURED_ECR_REPOSITORY_NAME: ${{ steps.before.outputs.ecr_repository_name }}
          CLOUDWATCH_LOG_GROUP_NAME: ${{ steps.before.outputs.cloudwatch_log_group_name }}
          ECS_CLUSTER_NAME: ${{ steps.before.outputs.ecs_cluster_name }}
          EXPRESS_SERVICE_ARN: ${{ steps.before.outputs.express_service_arn }}
          EXPRESS_SERVICE_NAME: ${{ steps.before.outputs.express_service_name }}
          INSTANCE_ID: ${{ steps.before.outputs.instance_id }}
          SECURITY_GROUP_ID: ${{ steps.before.outputs.security_group_id }}
          SERVICE_URL: ${{ steps.before.outputs.service_url }}
        run: |
          set -euo pipefail

          DESTROY_VERIFY_ATTEMPTS=30
          DESTROY_VERIFY_DELAY_SECONDS=10

          wait_until_gone() {
            local description="$1"
            local check_function="$2"
            local attempt

            for attempt in $(seq 1 "${DESTROY_VERIFY_ATTEMPTS}"); do
              if ! "${check_function}"; then
                echo "${description} is gone."
                return 0
              fi

              if [ "${attempt}" -eq "${DESTROY_VERIFY_ATTEMPTS}" ]; then
                echo "${description} still exists after destroy wait." >&2
                return 1
              fi

              echo "${description} still exists after destroy; waiting ${DESTROY_VERIFY_DELAY_SECONDS}s (${attempt}/${DESTROY_VERIFY_ATTEMPTS})."
              sleep "${DESTROY_VERIFY_DELAY_SECONDS}"
            done
          }

          runtime_endpoint_responds() {
            [ -n "${SERVICE_URL}" ] && curl -fsS --max-time 15 "${SERVICE_URL}" >/dev/null 2>&1
          }

          security_group_exists() {
            [ -n "${SECURITY_GROUP_ID}" ] && aws ec2 describe-security-groups --group-ids "${SECURITY_GROUP_ID}" >/dev/null 2>&1
          }

          active_instance_exists() {
            [ -n "${INSTANCE_ID}" ] || return 1
            ACTIVE_INSTANCE_ID=$(aws ec2 describe-instances \
              --instance-ids "${INSTANCE_ID}" \
              --query "Reservations[].Instances[?State.Name!='terminated'].InstanceId" \
              --output text 2>/dev/null || true)
            [ -n "${ACTIVE_INSTANCE_ID}" ]
          }

          express_service_exists() {
            [ -n "${EXPRESS_SERVICE_ARN}" ] && aws ecs describe-express-gateway-service --service-arn "${EXPRESS_SERVICE_ARN}" >/dev/null 2>&1
          }

          log_group_exists() {
            [ -n "${CLOUDWATCH_LOG_GROUP_NAME}" ] || return 1
            EXISTING_LOG_GROUP=$(aws logs describe-log-groups \
              --log-group-name-prefix "${CLOUDWATCH_LOG_GROUP_NAME}" \
              --query "logGroups[?logGroupName=='${CLOUDWATCH_LOG_GROUP_NAME}'].logGroupName" \
              --output text)
            [ -n "${EXISTING_LOG_GROUP}" ]
          }

          active_cluster_exists() {
            [ -n "${ECS_CLUSTER_NAME}" ] || return 1
            ACTIVE_CLUSTER=$(aws ecs describe-clusters \
              --clusters "${ECS_CLUSTER_NAME}" \
              --query "clusters[?status!='INACTIVE'].clusterName" \
              --output text)
            [ -n "${ACTIVE_CLUSTER}" ]
          }

          wait_until_gone "Runtime endpoint ${SERVICE_URL}" runtime_endpoint_responds

          case "${RUNTIME_KIND}" in
            ec2)
              wait_until_gone "EC2 runtime security group ${SECURITY_GROUP_ID}" security_group_exists
              wait_until_gone "EC2 runtime instance ${INSTANCE_ID}" active_instance_exists
              ;;
            ecs-express)
              wait_until_gone "ECS Express runtime service ${EXPRESS_SERVICE_ARN}" express_service_exists
              wait_until_gone "ECS runtime log group ${CLOUDWATCH_LOG_GROUP_NAME}" log_group_exists
              wait_until_gone "ECS runtime cluster ${ECS_CLUSTER_NAME}" active_cluster_exists
              ;;
          esac

          ECR_REPOSITORY_TO_CHECK="${CAPTURED_ECR_REPOSITORY_NAME:-${ECR_REPOSITORY_NAME}}"
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_TO_CHECK}" >/dev/null

          echo "Selected runtime is gone; durable ECR repository remains describable: ${ECR_REPOSITORY_TO_CHECK}."
