name: gcp-cloud-run-deploy

# Approved deploy path for Lab 08. ECR remains canonical; the approved job
# pulls the immutable ECR tag, mirrors it to Artifact Registry with Docker
# pull/tag/push, applies Cloud Run Terraform with that explicit tag, then
# verifies the public Cloud Run HTTPS endpoint.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/cidr-calculator/**"
      - "labs/08-static-site-cloud-run/**"
      - ".github/workflows/gcp-cloud-run-deploy.yml"

permissions:
  contents: read

concurrency:
  group: gcp-cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  GCP_PROJECT_ID: portfolio-devops-labs
  GCP_REGION: asia-northeast1
  GCP_STATE_BUCKET: portfolio-devops-labs-tf-state
  GCP_WIF_PROVIDER: projects/993692022673/locations/global/workloadIdentityPools/github-actions/providers/github
  LAB_ID: 08-static-site-cloud-run
  LAB_PATH: labs/08-static-site-cloud-run
  APP_PATH: apps/cidr-calculator
  IMAGE_TAG: sha-${{ github.sha }}
  SERVICE_NAME: cidr-calculator
  ECR_REPOSITORY_NAME: devops-static-site-cloud-run-stage-cidr-calculator
  ARTIFACT_REGISTRY_REPOSITORY_ID: devops-static-site-cloud-run-stage-cidr-calculator
  GCP_RUNTIME_STATE_PREFIX: gcp/runtime/labs/08-static-site-cloud-run/stage
  GITHUB_ENVIRONMENT: lab-08-stage
  AWS_IMAGE_PUSH_ROLE_ARN: arn:aws:iam::549475122024:role/devops-static-site-cloud-run-stage-github-image-push
  AWS_ECR_PULL_ROLE_ARN: arn:aws:iam::549475122024:role/devops-static-site-cloud-run-stage-github-image-pull
  GCP_PLAN_SERVICE_ACCOUNT: lab-08-cloudrun-plan@portfolio-devops-labs.iam.gserviceaccount.com
  GCP_APPLY_SERVICE_ACCOUNT: lab-08-cloudrun-apply@portfolio-devops-labs.iam.gserviceaccount.com

jobs:
  preflight-build-push-plan:
    name: Build, smoke, push/reuse ECR, and plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      ecr_repository_url: ${{ steps.ecr.outputs.ecr_repository_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install app toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          working_directory: ${{ env.APP_PATH }}

      - name: App checks
        working-directory: ${{ env.APP_PATH }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Build and local smoke test
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="cidr-calculator:deploy-${GITHUB_SHA}-${LAB_ID}"
          NAME="cidr-deploy-${GITHUB_RUN_ID}-${LAB_ID}"
          docker build -t "$IMAGE" .
          docker run --rm -d --name "$NAME" -p 8093:80 "$IMAGE"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl -fsS "http://localhost:8093" | grep -q "CIDR Calculator"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$NAME"
          exit 1

      - name: Authenticate to AWS for ECR push/reuse only
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ env.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push or reuse immutable ECR image
        id: ecr
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URL=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "ecr_repository_url=${ECR_REPOSITORY_URL}" >> "$GITHUB_OUTPUT"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Reusing existing image ${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          else
            REGISTRY=${ECR_REPOSITORY_URL%/*}
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            docker tag "cidr-calculator:deploy-${GITHUB_SHA}-${LAB_ID}" "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
            docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          fi

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Authenticate to GCP through WIF plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_PLAN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Write Terraform backend and variable files
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF_BACKEND
          bucket = "${GCP_STATE_BUCKET}"
          prefix = "${GCP_RUNTIME_STATE_PREFIX}"
          EOF_BACKEND

          cat > deploy.auto.tfvars <<EOF_TFVARS
          gcp_project_id                  = "${GCP_PROJECT_ID}"
          gcp_region                      = "${GCP_REGION}"
          artifact_registry_repository_id = "${ARTIFACT_REGISTRY_REPOSITORY_ID}"
          image_tag                       = "${IMAGE_TAG}"
          EOF_TFVARS

      - name: Terraform fmt, validate, and pre-approval plan
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive ../..
          terraform init -backend-config=backend.hcl
          terraform validate
          terraform plan -refresh=false -input=false -lock=false -no-color

  approve-mirror-apply-smoke:
    name: Approved mirror, apply, and smoke test
    needs: preflight-build-push-plan
    runs-on: ubuntu-latest
    environment: lab-08-stage
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS for ECR pull only
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ env.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull canonical ECR image
        shell: bash
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URL="${{ needs.preflight-build-push-plan.outputs.ecr_repository_url }}"
          REGISTRY=${ECR_REPOSITORY_URL%/*}
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

          # Keep AWS authority scoped to the completed ECR operation before GCP
          # Artifact Registry and Terraform steps run in later steps.
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_REGION="
            echo "AWS_DEFAULT_REGION="
          } >> "$GITHUB_ENV"

      - name: Authenticate to GCP through WIF apply identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_APPLY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Mirror immutable tag to Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URL="${{ needs.preflight-build-push-plan.outputs.ecr_repository_url }}"
          AR_HOST="${GCP_REGION}-docker.pkg.dev"
          AR_IMAGE="${AR_HOST}/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY_ID}/${SERVICE_NAME}:${IMAGE_TAG}"
          gcloud auth configure-docker "$AR_HOST" --quiet
          docker tag "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" "$AR_IMAGE"
          docker push "$AR_IMAGE"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Write Terraform backend and variable files
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF_BACKEND
          bucket = "${GCP_STATE_BUCKET}"
          prefix = "${GCP_RUNTIME_STATE_PREFIX}"
          EOF_BACKEND

          cat > deploy.auto.tfvars <<EOF_TFVARS
          gcp_project_id                  = "${GCP_PROJECT_ID}"
          gcp_region                      = "${GCP_REGION}"
          artifact_registry_repository_id = "${ARTIFACT_REGISTRY_REPOSITORY_ID}"
          image_tag                       = "${IMAGE_TAG}"
          EOF_TFVARS

      - name: Terraform apply explicit image tag
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl
          terraform plan -input=false -var="image_tag=${IMAGE_TAG}"
          terraform apply -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Deployed Cloud Run smoke test
        working-directory: ${{ env.LAB_PATH }}/infra/stage
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL=$(terraform output -raw service_url)
          for _ in {1..60}; do
            BODY=$(curl -fsSL "$SERVICE_URL" || true)
            if printf '%s' "$BODY" | grep -q "CIDR Calculator"; then
              echo "Smoke test passed: $SERVICE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed: $SERVICE_URL"
          exit 1
