name: diamol-ch16-build

on:
  push:
    paths:
      - ".github/workflows/diamol-ch16-build.yaml"
      - "labs/00-docker/diamol/ch16/cicd/build.ps1"
      - "labs/00-docker/diamol/ch16/cicd/set-vars.ps1"
      - "labs/00-docker/diamol/ch16/src/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: build
        working-directory: labs/00-docker/diamol/ch16/cicd
        run: ./build.ps1
        shell: pwsh
