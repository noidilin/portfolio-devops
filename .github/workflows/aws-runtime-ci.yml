name: aws-runtime-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cidr-calculator/**"
      - "labs/05-static-site-ec2/**"
      - "labs/06-static-site-ecs/**"
      - "infra/bootstrap/aws/**"
      - ".github/workflows/aws-bootstrap-ci.yml"
      - ".github/workflows/aws-runtime-ci.yml"
      - ".github/workflows/aws-runtime-deploy.yml"
      - ".github/workflows/aws-runtime-destroy.yml"

permissions:
  contents: read

concurrency:
  group: aws-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-labs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_labs: ${{ steps.detect.outputs.has_labs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "$CHANGED"

          include_05=false
          include_06=false
          if grep -Eq '^(infra/bootstrap/aws/|\.github/workflows/(aws-bootstrap-ci|aws-runtime-(ci|deploy|destroy))\.yml)' <<<"$CHANGED"; then
            include_05=true
            include_06=true
          fi
          if grep -q '^apps/cidr-calculator/' <<<"$CHANGED"; then
            include_05=true
            include_06=true
          fi
          if grep -q '^labs/05-static-site-ec2/' <<<"$CHANGED"; then include_05=true; fi
          if grep -q '^labs/06-static-site-ecs/' <<<"$CHANGED"; then include_06=true; fi

          MATRIX=$(INCLUDE_05="$include_05" INCLUDE_06="$include_06" node <<'NODE'
          const labs = [];
          if (process.env.INCLUDE_05 === 'true') labs.push({
            id: '05-static-site-ec2',
            path: 'labs/05-static-site-ec2',
            app_path: 'apps/cidr-calculator',
            app_toolchain_path: 'apps/cidr-calculator',
            build_context: 'apps/cidr-calculator',
            port: 8090,
            bootstrap_path: 'labs/05-static-site-ec2/infra/bootstrap',
            stage_path: 'labs/05-static-site-ec2/infra/stage',
            state_bucket: 'noidilin-tf-state',
            state_key: 'labs/05-static-site-ec2/infra/stage/terraform.tfstate',
            plan_role_arn: 'arn:aws:iam::549475122024:role/devops-static-site-ec2-stage-github-plan'
          });
          if (process.env.INCLUDE_06 === 'true') labs.push({
            id: '06-static-site-ecs',
            path: 'labs/06-static-site-ecs',
            app_path: 'apps/cidr-calculator',
            app_toolchain_path: 'apps/cidr-calculator',
            build_context: 'apps/cidr-calculator',
            port: 8091,
            bootstrap_path: 'labs/06-static-site-ecs/infra/bootstrap',
            stage_path: 'labs/06-static-site-ecs/infra/stage',
            state_bucket: 'noidilin-tf-state',
            state_key: 'labs/06-static-site-ecs/infra/stage/terraform.tfstate',
            plan_role_arn: 'arn:aws:iam::549475122024:role/devops-static-site-ecs-stage-github-plan'
          });
          process.stdout.write(JSON.stringify(labs));
          NODE
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then echo "has_labs=false" >> "$GITHUB_OUTPUT"; else echo "has_labs=true" >> "$GITHUB_OUTPUT"; fi

  check-lab:
    needs: detect-labs
    if: needs.detect-labs.outputs.has_labs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJson(needs.detect-labs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install app toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          working_directory: ${{ matrix.lab.app_toolchain_path }}
      - name: App checks
        working-directory: ${{ matrix.lab.app_path }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - name: Docker build and local smoke
        working-directory: ${{ matrix.lab.build_context }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="cidr-calculator:ci-${GITHUB_SHA}-${{ matrix.lab.id }}"
          NAME="cidr-ci-${GITHUB_RUN_ID}-${{ matrix.lab.id }}"
          docker build -t "$IMAGE" .
          docker run --rm -d --name "$NAME" -p "${{ matrix.lab.port }}:80" "$IMAGE"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl -fsS "http://localhost:${{ matrix.lab.port }}" | grep -q "CIDR Calculator"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$NAME"
          exit 1
      - name: Install lab infrastructure toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          working_directory: ${{ matrix.lab.path }}
      - name: Bootstrap Terraform static checks and contract tests
        working-directory: ${{ matrix.lab.bootstrap_path }}
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test
      - name: Runtime Stage Terraform contract tests
        working-directory: ${{ matrix.lab.stage_path }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform validate
          terraform test
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ matrix.lab.plan_role_arn }}
          aws-region: ap-northeast-1
      - name: Write Terraform backend config
        working-directory: ${{ matrix.lab.stage_path }}
        shell: bash
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF_BACKEND
          bucket       = "${{ matrix.lab.state_bucket }}"
          key          = "${{ matrix.lab.state_key }}"
          region       = "ap-northeast-1"
          use_lockfile = true
          encrypt      = true
          EOF_BACKEND
      - name: Terraform fmt, validate, plan
        id: tfplan
        working-directory: ${{ matrix.lab.stage_path }}
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive ../..
          terraform init -backend-config=backend.hcl -reconfigure
          terraform validate
          terraform plan -refresh=false -input=false -lock=false -no-color -var="image_tag=sha-${GITHUB_SHA}" | tee plan.txt
      - name: Comment Terraform plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.lab.stage_path }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...truncated...' : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan: ${{ matrix.lab.id }}\n\n\`\`\`terraform\n${truncated}\n\`\`\``
            });
